name: Binder tests
on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'

jobs:
  binder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - uses: ./.github/actions/virtual-lab-action
        with:
          action: build_test_on_ci
