name: Binder tests
on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'

permissions:
  packages: write

jobs:
  binder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - uses: ./.github/actions/virtual-lab-action
        with:
          action: show_link_to_binder
          registry_password: ${{ secrets.GITHUB_TOKEN }}
