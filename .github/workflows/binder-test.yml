name: Binder tests
on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'

permissions:
  packages: write
  pull-requests: write

jobs:
  binder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - uses: naavre/virtual-lab-action@main
        with:
          registry_password: ${{ secrets.GITHUB_TOKEN }}
          binder_url: https://naavre-dev.minikube.test/binderhub
